apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
#  annotations:
#    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: sk082-myfirst-ingress
  namespace: class-3
  labels:
    app: sk082-myfirst-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: sk082-myfirst-ingress.class-3.skala-us.com
    http:
      paths:
      - backend:
          service:
            name: sk082-myfirst-api-server
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - 'sk082-ingress.class-3.skala-us.com'
    secretName: wildcard-class-3-skala-us-com-tls
